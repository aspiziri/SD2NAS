# Runs the real image on a desktop against local test folders.
#   docker compose -f deploy/docker-compose.dev.yml up --build
# then open http://localhost:8080. Folders are created under ./tmp at the repo root.
services:
  sd2nas:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: dev-compose
    image: sd2nas:dev
    ports:
      - "8080:8080"
    environment:
      TZ: America/Los_Angeles
      UMASK: "000"
      PUID: "99"
      PGID: "100"
    volumes:
      - ../tmp/cards:/cards:ro
      - ../tmp/photos:/photos
      - ../tmp/config:/config
